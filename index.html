<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>Návykometr</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5;
  --ink: #20211f;
  --done: #242622;
  --missed: #f7f7f5;
  --border: #d5d6d0;
  --future: #e7e8e3;
  --today: #4779df;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: max(14px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
}
main { width: min(100%, 520px); margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; margin: 0 1px 12px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; }
#year { font-size: 13px; color: #62645e; font-variant-numeric: tabular-nums; }

/* Mřížka 7 sloupce */
#grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: clamp(3px, 1.15vw, 6px);
  width: 100%;
}

.day {
  aspect-ratio: 1;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: clamp(3px, 1vw, 6px);
  background: var(--missed);
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
}

.day.done { background: var(--done); border-color: var(--done); }
.day.future { background: var(--future); border-color: var(--future); cursor: default; opacity: 0.6; }
.day.today { outline: 2.5px solid var(--today); outline-offset: 1px; }

/* Ikony uvnitř políček */
.day.missed:after {
  content: "";
  width: 36%;
  height: 36%;
  border: 1.7px solid #62645e;
  border-radius: 2px;
}
.day.done:after {
  content: "";
  width: 37%;
  height: 21%;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: translateY(-12%) rotate(-45deg);
}

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

.controls {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
}

.color-pickers { display: flex; gap: 12px; align-items: center; font-size: 12px; color: #62645e; }
.color-picker-item { display: flex; align-items: center; gap: 4px; }
.color-picker-item input[type="color"] {
  -webkit-appearance: none;
  border: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  cursor: pointer;
  background: transparent;
}
.color-picker-item input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.color-picker-item input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 50%; }

.actions { display: flex; gap: 10px; }
button.utility {
  border: 0;
  background: transparent;
  color: #62645e;
  font: inherit;
  font-size: 12px;
  padding: 4px 2px;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

#notice { min-height: 1.2em; color: #62645e; font-size: 12px; margin-top: 6px; }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111210;
    --ink: #f1f2ec;
    --done: #2e7d32;
    --missed: #111210;
    --border: #4b4d46;
    --future: #272923;
    --today: #4779df;
  }
  #year, #notice, button.utility, .color-pickers { color: #a9aba3; }
  .day.missed:after { border-color: #a9aba3; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Návykometr</h1>
    <div id="year">100 dní</div>
  </header>

  <div id="grid" role="group" aria-label="100 denní návykometr"></div>

  <div class="controls">
    <div class="color-pickers">
      <div class="color-picker-item">
        <label for="doneColor">Splněno:</label>
        <input type="color" id="doneColor" value="#242622">
      </div>
      <div class="color-picker-item">
        <label for="todayColor">Dnes:</label>
        <input type="color" id="todayColor" value="#4779df">
      </div>
    </div>
    <div class="actions">
      <button class="utility" id="backup">Záloha</button>
      <button class="utility" id="restore">Obnovit</button>
      <input class="sr-only" id="file" type="file" accept="application/json">
    </div>
  </div>

  <div id="notice" role="status" aria-live="polite"></div>
</main>

<script>
(() => {
  const grid = document.getElementById('grid'),
        notice = document.getElementById('notice'),
        doneColorInput = document.getElementById('doneColor'),
        todayColorInput = document.getElementById('todayColor'),
        keyMissed = 'navykometr-missed-dates-v1',
        keyColors = 'navykometr-colors-v1';

  // Načtení dat o nesplněných dnech
  function loadMissed() {
    try {
      const a = JSON.parse(localStorage.getItem(keyMissed) || '[]');
      return new Set(Array.isArray(a) ? a.filter(x => typeof x === 'string') : []);
    } catch(e) { return new Set(); }
  }

  // Načtení a aplikace barviček
  function loadColors() {
    try {
      const c = JSON.parse(localStorage.getItem(keyColors) || '{}');
      if (c.done) {
        document.documentElement.style.setProperty('--done', c.done);
        doneColorInput.value = c.done;
      }
      if (c.today) {
        document.documentElement.style.setProperty('--today', c.today);
        todayColorInput.value = c.today;
      }
    } catch(e) {}
  }

  let missed = loadMissed();
  loadColors();

  const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  
  function saveMissed() {
    try {
      localStorage.setItem(keyMissed, JSON.stringify([...missed]));
      notice.textContent = '';
    } catch(e) {
      notice.textContent = 'Uložení se nezdařilo.';
    }
  }

  function saveColors() {
    try {
      localStorage.setItem(keyColors, JSON.stringify({
        done: doneColorInput.value,
        today: todayColorInput.value
      }));
    } catch(e) {}
  }

  function render() {
    const now = new Date();
    const todayStr = dateKey(now);
    grid.replaceChildren();

    // Vygenerujeme 100 dní od dneška dále
    for (let i = 0; i < 100; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, 12, 0, 0);
      const k = dateKey(d);
      const isToday = (i === 0);
      const isFuture = (i > 0);
      const isMissed = missed.has(k);

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'day';

      // Nastavení textového popisku
      let stateText = isFuture ? 'budoucí den' : (isMissed ? 'nesplněno' : 'splněno');
      b.setAttribute('aria-label', `${k}: ${stateText}`);
      b.title = `${k} — ${stateText}`;

      // Vzhled políčka
      if (isToday) {
        b.classList.add('today');
      }

      if (isFuture) {
        b.classList.add('future');
      } else {
        if (isMissed) {
          b.classList.add('missed');
        } else {
          b.classList.add('done');
        }

        // Klikatelná jsou pouze dnešní a minulá políčka
        b.addEventListener('click', () => {
          if (missed.has(k)) {
            missed.delete(k);
          } else {
            missed.add(k);
          }
          saveMissed();
          render();
        });
      }

      grid.appendChild(b);
    }
  }

  // Změna barvy splněno
  doneColorInput.addEventListener('input', (e) => {
    document.documentElement.style.setProperty('--done', e.target.value);
    saveColors();
  });

  // Změna barvy dneška
  todayColorInput.addEventListener('input', (e) => {
    document.documentElement.style.setProperty('--today', e.target.value);
    saveColors();
  });

  // Export zálohy
  document.getElementById('backup').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ format: 'navykometr-v1', missed: [...missed] }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'navykometr-zaloha.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    notice.textContent = 'Záloha stažena.';
  });

  // Import zálohy
  document.getElementById('restore').addEventListener('click', () => document.getElementById('file').click());
  document.getElementById('file').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.format !== 'navykometr-v1' || !Array.isArray(d.missed)) throw Error();
      missed = new Set(d.missed);
      saveMissed();
      render();
      notice.textContent = 'Záloha byla obnovena.';
    } catch (_) {
      notice.textContent = 'Soubor není platná záloha.';
    }
    e.target.value = '';
  });

  render();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) render();
  });
})();
</script>
</body>
</html>
